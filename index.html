<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geolocation Demo</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Where am I?</h1>
      <p id="status" class="status">Click the button to share your location.</p>

      <button id="find-me">Find me</button>

      <dl class="details">
        <dt>Latitude</dt>
        <dd id="latitude">—</dd>

        <dt>Longitude</dt>
        <dd id="longitude">—</dd>
      </dl>
    </main>
    <script src="./js/script.js"></script>
  </body>
</html>
